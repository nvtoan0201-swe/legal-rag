# Optional containerised run. The default local setup needs no Docker: leave
# QDRANT_URL empty and Qdrant runs embedded at QDRANT_PATH (see .env.example).
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot ingestion: parse -> chunk -> embed -> Qdrant.
  # Skips the work when the collections already hold points.
  ingest:
    build: .
    command: ["python", "-m", "ingestion", "--granularity", "all", "--skip-if-loaded"]
    environment:
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      ingest:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy

volumes:
  qdrant_storage:
  hf_cache:
